rules:
  - id: order-time-range
    operation_id: createOrder
    description: end_time must be later than start_time
    expected_status_codes: [422]
  - id: discount-not-over-total
    operation_id: createOrder
    description: discount_amount must not exceed total_amount
    expected_status_codes: [422]
  - id: cash-card-token-forbidden
    operation_id: createOrder
    description: cash payments must omit card_token
    expected_status_codes: [422]
  - id: card-token-required
    operation_id: createOrder
    description: card payments must provide card_token
    expected_status_codes: [422]
  - id: unique-user-email
    operation_id: createUser
    description: creating a second user with the same email must return 409
    expected_status_codes: [409]
  - id: cancelled-order-terminal
    operation_id: updateOrderStatus
    description: a cancelled order cannot transition to another status
    expected_status_codes: [409]
  - id: repeated-order-status-conflict
    operation_id: updateOrderStatus
    description: applying the current order status again must return 409
    expected_status_codes: [409]
