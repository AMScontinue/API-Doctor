rules:
  - id: order-time-range
    operation_id: createOrder
    description: 订单结束时间必须晚于开始时间；违反时返回 422。
    expected_status_codes: [422]
  - id: discount-not-over-total
    operation_id: createOrder
    description: 折扣金额不得大于订单总金额；违反时返回 422。
    expected_status_codes: [422]
  - id: card-token-required
    operation_id: createOrder
    description: payment_method 为 card 时 card_token 必填；缺失时返回 422。
    expected_status_codes: [422]
  - id: quantity-positive
    operation_id: createOrder
    description: quantity 必须大于等于 1；低于最小值时返回 422。
    expected_status_codes: [422]
  - id: user-email-required
    operation_id: createUser
    description: 创建用户时 email 必填；缺失时返回 422。
    expected_status_codes: [422]
  - id: unsupported-create-query
    description: 创建用户后必须能够通过返回的 ID 查询到相同用户。
    expected_status_codes: [200]
  - id: unsupported-cancel-pay
    description: 已取消的订单不能再次支付。
    expected_status_codes: [409]
  - id: unsupported-idempotency
    operation_id: createOrder
    description: 使用相同 Idempotency-Key 重试创建订单时不得创建重复订单。
    expected_status_codes: [200, 201]
  - id: invalid-field-reference
    operation_id: createOrder
    description: legacy_code 必须是正数；违反时返回 422。
    expected_status_codes: [422]
  - id: ambiguous-risk-review
    operation_id: createOrder
    description: 高风险用户的大额订单需要经过适当审核。
